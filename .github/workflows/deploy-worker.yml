name: Deploy Sync Worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:
    inputs:
      lane:
        description: "Which Worker to deploy"
        type: choice
        default: prod
        options: [prod, dev]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing required variable CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing required secret CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          npm run deploy -- ${{ inputs.lane == 'dev' && '--env dev' || '' }}
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          test -n "$WORKER_URL" || { echo "Missing required variable SYNC_URL" >&2; exit 1; }
          [ "$LANE" = "dev" ] && WORKER_URL="${WORKER_URL/ledger-sync./ledger-sync-dev.}"
          RESP_FILE="${RUNNER_TEMP}/smoke-response.txt"
          HTTP_STATUS=$(curl -sS -o "$RESP_FILE" -w "%{http_code}" --max-time 15 \
            -H "Origin: https://jordandav-is.github.io" \
            -H "Content-Type: application/json" \
            -d '{"email":"deployment-smoke@example.invalid","password":"DeploymentSmokePassword123!"}' \
            "${WORKER_URL%/}/login" || echo "000")
          if [ "$HTTP_STATUS" != "401" ]; then
            echo "Smoke probe failed with status $HTTP_STATUS" >&2
            cat "$RESP_FILE" >&2
            exit 1
          fi
        env:
          WORKER_URL: ${{ vars.SYNC_URL }}
          LANE: ${{ inputs.lane || 'prod' }}
