name: Deploy Sync Worker

# Redeploys worker/ on push — but only when a CLOUDFLARE_API_TOKEN repo
# secret exists (Settings → Secrets → Actions). Without it this workflow
# exits quietly and `npx wrangler deploy` from worker/ remains the way.
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: worker
        run: npx wrangler@4 deploy
