name: Deploy Sync Worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        working-directory: worker
      - run: npm test
        working-directory: worker
      - run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing required variable CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing required secret CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          npm run deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - run: |
          set -euo pipefail
          TAIL_LOG="${RUNNER_TEMP}/wrangler-tail.log"
          : > "$TAIL_LOG"
          timeout 45s npx wrangler tail --format pretty > "$TAIL_LOG" 2>&1 &
          TAIL_PID=$!
          cleanup() {
            kill "$TAIL_PID" 2>/dev/null || true
            wait "$TAIL_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          sleep 8

          RESP_FILE="${RUNNER_TEMP}/login-probe-response.txt"
          HTTP_STATUS=$(curl -sS -o "$RESP_FILE" -w "%{http_code}" --max-time 10 \
            -H "Origin: https://jordandav-is.github.io" \
            -H "Content-Type: application/json" \
            -d '{"email":"diagnostic-probe@example.com","password":"DiagnosticPassword123!"}' \
            "${WORKER_URL%/}/login" || echo "000")

          sleep 10
          cleanup
          trap - EXIT

          if [ "$HTTP_STATUS" != "401" ]; then
            echo "Probe failed with status $HTTP_STATUS" >&2
            echo "Response body:" >&2
            cat "$RESP_FILE" >&2
            echo "Wrangler tail output:" >&2
            cat "$TAIL_LOG" >&2
            exit 1
          fi
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_URL: ${{ vars.SYNC_URL }}
