name = "ledger-sync"
main = "worker.js"
compatibility_date = "2026-08-01"

[vars]
GATE_SALT = "edffce3ce9712cbd6f997900359f6dd9"
GATE_HASH = "faf79b899def21c5e3f3cdce3ac6813f2ac2c01c8b4f9c6cce222cf84ad4aed1"
GATE_ITERATIONS = 600000
# Conjuring meters: 0 = unmetered. Re-enable with e.g. 4 per account and 60 global.
CONJURE_ROUNDS_PER_ACCOUNT = 0
CONJURE_ROUNDS_GLOBAL = 0
CONJURE_UNMETERED = "jordan@jordandav.is"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "ledger-assets"

[[durable_objects.bindings]]
name = "IDENTITY"
class_name = "Identity"

[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "Account"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Account"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Identity"]
