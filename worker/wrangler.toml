# The ledger's sync server. Deploy from this directory: npx wrangler deploy
# (first time: wrangler opens a browser to authorize your Cloudflare account).
# The printed *.workers.dev URL goes into src/sync-config.js.
name = "ledger-sync"
main = "worker.js"
compatibility_date = "2026-08-01"

# Registration demands the app's gate passphrase — the same public hash
# committed in src/gate-config.js. Rotate them together.
[vars]
GATE_HASH = "faf79b899def21c5e3f3cdce3ac6813f2ac2c01c8b4f9c6cce222cf84ad4aed1"

[[durable_objects.bindings]]
name = "ACCOUNT"
class_name = "Account"

# SQLite-backed: the only Durable Object flavor on the free plan — and all this needs.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Account"]
